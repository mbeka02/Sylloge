services:
  app:
    profiles: [dev]
    build:
      context: .
      target: development
    environment:
      # '-' defaults only unset inputs; an explicit empty value reaches validation.
      PORT: ${PORT-3000}
      APP_ENV: ${APP_ENV-development}
      ROUTING_CONFIG_FILE: ${ROUTING_CONFIG_FILE-configs/routing.example.json}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT-10s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT-10s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT-60s}
      HTTP_MAX_HEADER_BYTES: ${HTTP_MAX_HEADER_BYTES-16384}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT-60s}
      MAX_ACTIVE_REQUESTS: ${MAX_ACTIVE_REQUESTS-128}
      RATE_LIMIT: ${RATE_LIMIT-1000}
      RATE_LIMIT_MAX_IPS: ${RATE_LIMIT_MAX_IPS-10000}
      RATE_LIMIT_IDLE_TIMEOUT: ${RATE_LIMIT_IDLE_TIMEOUT-60s}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES-}
      RAW_LOGS_CAPACITY: ${RAW_LOGS_CAPACITY-10000}
      INGEST_BATCH_SIZE: ${INGEST_BATCH_SIZE-50}
      ADMISSION_TIMEOUT: ${ADMISSION_TIMEOUT-100ms}
    ports:
      - "127.0.0.1:${PORT-3000}:${PORT-3000}"
    # Exceed the application's normal drain budget so Docker does not cut it short.
    stop_grace_period: 70s
